# creatorsplan runs one way everywhere: with accounts, plans and the free
# minutes. Locally that means a Postgres next to the backend, a dev JWT
# secret, and your own GEMINI_API_KEY (from .env) used as the server's key.
# Production adds its secrets with docker-compose.cloud.yml.
#
# Sign-in links: with no SMTP_* settings in .env the backend prints the link in
# its log instead of emailing it (`docker compose logs -f backend`).
services:
  db:
    image: postgres:16-alpine
    container_name: creatorsplan-db
    environment:
      - POSTGRES_USER=openshorts
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-creatorsplan-local}
      - POSTGRES_DB=openshorts
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openshorts"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    container_name: creatorsplan-backend
    ports:
      - "8001:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    depends_on:
      db:
        condition: service_healthy
    environment:
      - BILLING_ENABLED=true
      - DATABASE_URL=postgresql+asyncpg://openshorts:${POSTGRES_PASSWORD:-creatorsplan-local}@db:5432/openshorts
      # Local default only; production sets a real one.
      - JWT_SECRET=${JWT_SECRET:-creatorsplan-local-dev-secret}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5175}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5175,http://localhost:8001}
      # The server's own key powers every account's minutes. Locally it falls
      # back to the key you already have in .env.
      - MANAGED_GEMINI_API_KEY=${MANAGED_GEMINI_API_KEY:-${GEMINI_API_KEY:-}}
      # "Continue with Google" appears once both are set (see .env.example).
      # The redirect goes straight to the backend: the Vite proxy would hand
      # Google the internal Docker host name.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI:-http://localhost:8001/api/auth/google/callback}
      # Real sign-in emails; empty means the link is printed in the backend log.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: creatorsplan-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: creatorsplan-renderer
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  pgdata:
